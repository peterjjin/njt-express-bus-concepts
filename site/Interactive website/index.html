<style>*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:16px/1.4 'Segoe UI',Arial,sans-serif;color:#203340;display:flex;flex-direction:column;background:#f3f5f6}header{padding:15px 24px 12px;background:white;border-bottom:1px solid #aebbc3;flex:none}h1{font-size:21px;margin:0 0 10px}nav{display:flex;align-items:center;gap:9px;flex-wrap:wrap}button,a{font:inherit}button{background:white;border:1px solid #aebbc3;color:#203340;border-radius:3px;padding:9px 14px;cursor:pointer}button[aria-pressed=true]{background:#203340;border-color:#203340;color:white}a{color:#18577c;margin-left:auto;font-size:14px}iframe{display:block;width:100%;flex:1;min-height:350px;border:0;background:#f3f5f6}button:focus-visible,a:focus-visible{outline:3px solid #cf8612;outline-offset:3px}@media(max-width:650px){header{padding:12px}h1{font-size:19px}button{font-size:14px;padding:9px 10px}nav a{margin-left:0;width:100%}}</style>
<meta name="referrer" content="strict-origin-when-cross-origin"></head><body><header><h1>Express bus concepts · choose a park-and-ride alternative</h1><nav aria-label="Park-and-ride alternative"><button id="neilson" aria-pressed="true">A · Neilson Plaza</button><button id="mary" aria-pressed="false">B · Mary Ellis Burial Site</button><a href="Map%20setup.html">Map connection / API setup</a><a href="../Route%20maps%20snapshots/Six%20Route%20Snapshots.html" target="_top">Route map snapshots</a></nav></header>
<iframe id="alternative-map" title="Neilson Plaza interactive route map" src="Neilson%20Plaza/index.html"></iframe>
<script>
const frame=document.getElementById('alternative-map');
const choices={neilson:{path:'Neilson%20Plaza/index.html',title:'Neilson Plaza interactive route map'},mary:{path:'Mary%20Ellis%20Burial%20Site/index.html',title:'Mary Ellis Burial Site interactive route map'}};
function chooseAlternative(key){if(!choices[key])key='neilson';const c=choices[key];document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.id===key)));frame.title=c.title;if(frame.getAttribute('src')!==c.path)frame.src=c.path;window.currentAlternative=key;}
document.getElementById('neilson').onclick=()=>chooseAlternative('neilson');document.getElementById('mary').onclick=()=>chooseAlternative('mary');
chooseAlternative(new URLSearchParams(location.search).get('alternative')||'neilson');
</script></body></html>
